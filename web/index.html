<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康指标管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0f1117;
            --bg-sidebar: #1a1d27;
            --bg-card: #1e2230;
            --bg-card-hover: #252a3a;
            --bg-input: #12141c;
            --border-color: #2a2e3f;
            --text-primary: #e8eaf0;
            --text-secondary: #8b8fa3;
            --text-muted: #5c6070;
            --accent: #5b8dee;
            --accent-glow: rgba(91, 141, 238, 0.25);
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
            --transition: all 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* === SIDEBAR === */
        .sidebar {
            width: 220px;
            min-height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0; top: 0;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-logo h1 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .sidebar-logo span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            font-size: 0.9rem;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.04);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--accent-glow);
            color: var(--accent);
            border-left-color: var(--accent);
        }

        .nav-item .icon {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .user-avatar {
            width: 32px; height: 32px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: white;
        }

        /* === MAIN CONTENT === */
        .main {
            margin-left: 220px;
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            padding: 0 28px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .topbar-date {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .content {
            padding: 28px;
            flex: 1;
        }

        /* === SECTION === */
        .section { display: none; }
        .section.active { display: block; }

        /* === GRID LAYOUTS === */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            transition: var(--transition);
        }

        .stat-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-card .unit {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .stat-card .status {
            margin-top: 8px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-card .status.ok { color: var(--success); }
        .stat-card .status.warn { color: var(--warning); }
        .stat-card .status.danger { color: var(--danger); }

        /* === CHART CARD === */
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
        }

        .chart-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chart-card-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .indicator-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .indicator-tab {
            padding: 4px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .indicator-tab:hover { border-color: var(--accent); color: var(--accent); }
        .indicator-tab.active { background: var(--accent); color: white; border-color: var(--accent); }

        .chart-container { height: 280px; position: relative; }
        .chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

        /* === TABLE === */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .table-card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-card-title {
            font-size: 1rem;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--bg-dark);
            padding: 10px 16px;
            text-align: left;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .abnormal-row td { color: var(--danger); }

        /* === BUTTONS === */
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #4a7cd6;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .btn-danger {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.25);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

        /* === FORM MODAL === */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            width: 480px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .modal-header {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 { font-size: 1rem; font-weight: 600; }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
        }

        .modal-close:hover { color: var(--text-primary); }

        .modal-body { padding: 20px 24px; }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.875rem;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* === INDICATOR INPUT LIST === */
        .indicator-input-list { display: flex; flex-direction: column; gap: 10px; }

        .indicator-input-row {
            display: grid;
            grid-template-columns: 1fr 100px 40px;
            gap: 8px;
            align-items: center;
        }

        .indicator-input-row label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .indicator-input-row .ref-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .indicator-input-row input {
            padding: 8px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.85rem;
            text-align: right;
        }

        .indicator-input-row input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .indicator-input-row input.abnormal-input {
            border-color: var(--danger);
            box-shadow: 0 0 0 2px rgba(248,113,113,0.2);
        }

        /* === REMINDER CARDS === */
        .reminder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .reminder-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px 20px;
        }

        .reminder-card .reminder-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .reminder-card .reminder-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .reminder-card .reminder-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* === ALERT / TOAST === */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            z-index: 300;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: var(--success);
        }

        .toast.error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: var(--danger);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* === SECTION HEADER === */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* === EMPTY STATE === */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
        .empty-state p { font-size: 0.9rem; }

        /* === LOADING === */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        /* === MISC === */
        .hidden { display: none !important; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-warning { color: var(--warning); }
        .text-muted { color: var(--text-muted); }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <h1>健康指标</h1>
        <span>管理系统</span>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-item active" data-target="dashboard">
            <span class="icon">◉</span> 仪表板
        </div>
        <div class="nav-item" data-target="trends">
            <span class="icon">📈</span> 趋势分析
        </div>
        <div class="nav-item" data-target="records">
            <span class="icon">📋</span> 历史记录
        </div>
        <div class="nav-item" data-target="reminders">
            <span class="icon">🔔</span> 提醒设置
        </div>
    </nav>
    <div class="sidebar-footer">
        <div class="user-badge">
            <div class="user-avatar">1</div>
            <span>用户 1</span>
        </div>
    </div>
</aside>

<!-- MAIN -->
<main class="main">
    <header class="topbar">
        <span class="topbar-title" id="topbarTitle">仪表板</span>
        <span class="topbar-date" id="topbarDate"></span>
    </header>

    <div class="content">
        <!-- DASHBOARD -->
        <section id="dashboard" class="section active">
            <div class="section-header">
                <h2>健康概览</h2>
                <button class="btn btn-primary" onclick="openRecordModal()">+ 添加记录</button>
            </div>
            <div class="stat-grid" id="statGrid">
                <div class="loading">加载中...</div>
            </div>
        </section>

        <!-- TRENDS -->
        <section id="trends" class="section">
            <div class="section-header">
                <h2>趋势分析</h2>
            </div>
            <div class="chart-grid">
                <div class="chart-card">
                    <div class="chart-card-header">
                        <span class="chart-card-title">肾功能</span>
                        <div class="indicator-tabs" id="chartTabs_renal"></div>
                    </div>
                    <div class="chart-container"><canvas id="chart_renal"></canvas></div>
                </div>
                <div class="chart-card">
                    <div class="chart-card-header">
                        <span class="chart-card-title">尿检</span>
                        <div class="indicator-tabs" id="chartTabs_urine"></div>
                    </div>
                    <div class="chart-container"><canvas id="chart_urine"></canvas></div>
                </div>
                <div class="chart-card">
                    <div class="chart-card-header">
                        <span class="chart-card-title">血脂血糖</span>
                        <div class="indicator-tabs" id="chartTabs_lipid"></div>
                    </div>
                    <div class="chart-container"><canvas id="chart_lipid"></canvas></div>
                </div>
                <div class="chart-card">
                    <div class="chart-card-header">
                        <span class="chart-card-title">血常规</span>
                        <div class="indicator-tabs" id="chartTabs_blood"></div>
                    </div>
                    <div class="chart-container"><canvas id="chart_blood"></canvas></div>
                </div>
            </div>
        </section>

        <!-- RECORDS -->
        <section id="records" class="section">
            <div class="section-header">
                <h2>历史记录</h2>
                <button class="btn btn-primary" onclick="openRecordModal()">+ 添加记录</button>
            </div>
            <div class="table-card">
                <div class="table-card-header">
                    <span class="table-card-title">全部记录</span>
                    <button class="btn btn-ghost" onclick="refreshCurrent()">刷新</button>
                </div>
                <div id="recordsTableContainer">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </section>

        <!-- REMINDERS -->
        <section id="reminders" class="section">
            <div class="section-header">
                <h2>提醒设置</h2>
                <button class="btn btn-primary" onclick="openReminderModal()">+ 添加提醒</button>
            </div>
            <div class="reminder-grid" id="reminderGrid">
                <div class="loading">加载中...</div>
            </div>
        </section>
    </div>
</main>

<!-- RECORD MODAL -->
<div class="modal-overlay" id="recordModal">
    <div class="modal" style="width:620px;">
        <div class="modal-header" style="padding:12px 16px;">
            <h3 id="recordModalTitle" style="font-size:0.95rem;">添加健康记录</h3>
            <button class="modal-close" onclick="closeRecordModal()">×</button>
        </div>
        <div class="modal-body" style="padding:10px 14px;">
            <form id="recordForm" onsubmit="submitRecordForm(event)">
                <input type="hidden" id="editRecordId">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
                    <div class="form-group" style="margin:0;">
                        <label style="font-size:0.75rem;margin-bottom:3px;display:block;">记录日期</label>
                        <input type="date" id="modalRecordDate" required style="padding:7px 8px;font-size:0.8rem;">
                    </div>
                    <div class="form-group" style="margin:0;">
                        <label style="font-size:0.75rem;margin-bottom:3px;display:block;">类别筛选</label>
                        <select id="modalCategory" onchange="renderAllIndicators([])" style="padding:7px 8px;font-size:0.8rem;">
                            <option value="综合健康检查">全部</option>
                            <option value="生化筛查/肝肾脂糖电解质">生化筛查/肝肾脂糖电解质</option>
                            <option value="血常规">血常规</option>
                            <option value="尿常规">尿常规</option>
                            <option value="尿蛋白、尿素、肌酐测定">尿蛋白、尿素、肌酐测定</option>
                            <option value="血清碳酸氢盐测定">血清碳酸氢盐测定</option>
                        </select>
                    </div>
                </div>
                <div id="allIndicatorsContainer" style="max-height:42vh;overflow-y:auto;"></div>
            </form>
        </div>
        <div class="modal-footer" style="padding:10px 16px;">
            <button class="btn btn-ghost" onclick="closeRecordModal()" style="padding:6px 12px;font-size:0.8rem;">取消</button>
            <button class="btn btn-primary" onclick="submitRecordForm(event)" style="padding:6px 12px;font-size:0.8rem;">保存</button>
        </div>
    </div>
</div>

<!-- REMINDER MODAL -->
<div class="modal-overlay" id="reminderModal">
    <div class="modal">
        <div class="modal-header">
            <h3>添加提醒</h3>
            <button class="modal-close" onclick="closeReminderModal()">×</button>
        </div>
        <div class="modal-body">
            <form id="reminderForm" onsubmit="submitReminderForm(event)">
                <div class="form-group">
                    <label>提醒类型</label>
                    <select id="modalReminderType" required>
                        <option value="medication">用药提醒</option>
                        <option value="test">检查提醒</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>提醒内容</label>
                    <input type="text" id="modalReminderTitle" placeholder="如：定期复查肾功能" required>
                </div>
                <div class="form-group">
                    <label>下次提醒日期</label>
                    <input type="date" id="modalReminderDate" required>
                </div>
                <div class="form-group">
                    <label>频率</label>
                    <select id="modalReminderFreq">
                        <option value="">一次性</option>
                        <option value="daily">每天</option>
                        <option value="weekly">每周</option>
                        <option value="monthly">每月</option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeReminderModal()">取消</button>
            <button class="btn btn-primary" onclick="submitReminderForm(event)">保存</button>
        </div>
    </div>
</div>

<div id="toastContainer"></div>

<script>
const API = '/api';
let currentUserId = 1;
let healthConfig = [];
let editingRecordId = null;
let currentSection = 'dashboard';
let editingPresetResults = [];  // 编辑时保存已有数据，切换类别时不会丢失

function refreshCurrent() {
    if (currentSection === 'dashboard') loadDashboard();
    else if (currentSection === 'trends') loadTrends();
    else if (currentSection === 'records') loadRecords();
    else if (currentSection === 'reminders') loadReminders();
}

// === NAVIGATION ===
function navigateTo(target, updateHash) {
    if (updateHash !== false) location.hash = target;
    currentSection = target;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelector('.nav-item[data-target="' + target + '"]').classList.add('active');
    document.getElementById(target).classList.add('active');
    document.getElementById('topbarTitle').textContent =
        { dashboard: '仪表板', trends: '趋势分析', records: '历史记录', reminders: '提醒设置' }[target] || '仪表板';
    if (target === 'dashboard') loadDashboard();
    else if (target === 'trends') loadTrends();
    else if (target === 'records') loadRecords();
    else if (target === 'reminders') loadReminders();
}

document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => navigateTo(item.dataset.target));
});

// 监听 hash 变化（浏览器前进后退）
window.addEventListener('hashchange', function() {
    const hash = location.hash.slice(1) || 'dashboard';
    navigateTo(hash, false);
});

// === INIT ===
window.onload = async function() {
    const today = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('topbarDate').textContent = today;
    document.getElementById('modalRecordDate').valueAsDate = new Date();
    document.getElementById('modalReminderDate').valueAsDate = new Date();

    // ESC 关闭弹窗
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const activeModal = document.querySelector('.modal-overlay.active');
            if (activeModal) {
                if (activeModal.id === 'recordModal') closeRecordModal();
                else if (activeModal.id === 'reminderModal') closeReminderModal();
            }
        }
    });

    await loadHealthConfig();
    // 根据 URL hash 恢复页面
    const hash = location.hash.slice(1) || 'dashboard';
    navigateTo(hash, false);
};

async function loadHealthConfig() {
    try {
        const res = await fetch(API + '/health_config');
        healthConfig = await res.json();
    } catch (e) { healthConfig = []; }
}

// === DASHBOARD ===
async function loadDashboard() {
    await loadHealthConfig();
    await loadStatCards();
}

async function loadStatCards() {
    const container = document.getElementById('statGrid');
    try {
        const res = await fetch(API + '/health_records?user_id=' + currentUserId);
        const records = await res.json();

        if (!records || records.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="icon">📊</div><p>暂无健康记录<br><br><button class="btn btn-primary" onclick="openRecordModal()">添加第一条记录</button></p></div>';
            return;
        }

        // 取最新一条记录
        const latest = records[0];
        let html = '';
        healthConfig.forEach(cat => {
            cat.indicators.forEach(ind => {
                const result = latest.results.find(r => r.indicator === ind.name);
                const value = result ? result.value : null;
                const abnormal = result ? result.abnormal : false;
                if (value === null) return;
                const statusClass = abnormal ? 'warn' : 'ok';
                const statusText = abnormal ? '⚠️ 异常' : '✓ 正常';
                html += `
                    <div class="stat-card">
                        <div class="label">${ind.name}</div>
                        <div><span class="value">${value}</span><span class="unit">${ind.unit}</span></div>
                        <div class="status ${statusClass}">${statusText}</div>
                    </div>`;
            });
        });
        container.innerHTML = html || '<div class="empty-state"><p>暂无指标数据</p></div>';
    } catch (e) {
        container.innerHTML = '<div class="text-danger">加载失败</div>';
    }
}

// === TRENDS ===
const chartGroups = {
    renal: { title: '肾功能', indicators: ['肌酐', '尿素', '尿酸', '肾小球滤过率epi-cr'] },
    urine: { title: '尿检', indicators: ['尿蛋白', '尿蛋白肌酐比值', '尿肌酐', '尿尿素'] },
    lipid: { title: '血脂血糖', indicators: ['总胆固醇', '甘油三酯', '空腹血糖'] },
    blood: { title: '血常规', indicators: ['红细胞计数', '血红蛋白', '红细胞压积', '中性粒细胞', '淋巴细胞'] }
};

const chartInstances = {};
const chartSelected = {};

async function loadTrends() {
    await loadHealthConfig();
    for (const [key, group] of Object.entries(chartGroups)) {
        chartSelected[key] = [...group.indicators];
        await renderGroupChart(key);
    }
}

async function renderGroupChart(groupKey) {
    const canvas = document.getElementById('chart_' + groupKey);
    if (chartInstances[groupKey]) { chartInstances[groupKey].destroy(); chartInstances[groupKey] = null; }
    if (!canvas) return;

    const indicators = chartSelected[groupKey] || [];
    if (indicators.length === 0) return;

    const colors = ['#5b8dee', '#34d399', '#fbbf24', '#f87171', '#a78bfa'];
    const allDatesSet = new Set();
    const dateValMap = {};
    const datasetMap = {};

    for (let i = 0; i < indicators.length; i++) {
        const name = indicators[i];
        try {
            const res = await fetch(API + '/trends?user_id=' + currentUserId + '&indicator=' + encodeURIComponent(name));
            const data = await res.json();
            if (!data || !Array.isArray(data) || data.length === 0) continue;

            dateValMap[name] = {};
            data.forEach(d => { allDatesSet.add(d.date); dateValMap[name][d.date] = d.value; });

            const ctx2d = canvas.getContext('2d');
            const grad = ctx2d.createLinearGradient(0, 0, 0, 280);
            grad.addColorStop(0, colors[i] + '40');
            grad.addColorStop(1, colors[i] + '00');

            datasetMap[name] = {
                label: name, data: [],
                borderColor: colors[i], borderWidth: 2.5,
                backgroundColor: grad, fill: true, tension: 0.5,
                pointRadius: 5, pointHoverRadius: 8,
                pointBackgroundColor: colors[i], pointBorderColor: '#1e2230', pointBorderWidth: 2,
            };
        } catch (e) {}
    }

    const allDates = Array.from(allDatesSet).sort();
    if (allDates.length === 0) return;

    const datasets = indicators.filter(name => datasetMap[name]).map(name => {
        const ds = datasetMap[name];
        ds.data = allDates.map(d => dateValMap[name] ? (dateValMap[name][d] || null) : null);
        return ds;
    });

    const ctx = canvas.getContext('2d');
    chartInstances[groupKey] = new Chart(ctx, {
        type: 'line',
        data: { labels: allDates, datasets },
        options: {
            responsive: true, maintainAspectRatio: false,
            animation: { duration: 1000, easing: 'easeInOutQuart' },
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { labels: { color: '#b8bcc8', font: { size: 12 }, padding: 16, usePointStyle: true, pointStyleWidth: 16 } },
                tooltip: { backgroundColor: '#1e2230', borderColor: '#2a2e3f', borderWidth: 1, titleColor: '#e8eaf0', bodyColor: '#8b8fa3', padding: 12, cornerRadius: 8 }
            },
            scales: {
                x: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#6c6070', font: { size: 11 } } },
                y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#6c6070', font: { size: 11 } } }
            }
        }
    });
}

// === RECORDS ===
async function loadRecords() {
    const container = document.getElementById('recordsTableContainer');
    try {
        const res = await fetch(API + '/health_records?user_id=' + currentUserId);
        const records = await res.json();

        if (!records || records.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>暂无历史记录</p></div>';
            return;
        }

        let html = `<table><thead><tr><th>日期</th><th>类别</th><th>指标数</th><th>异常数</th><th>操作</th></tr></thead><tbody>`;
        records.forEach(r => {
            const date = r.record_date ? r.record_date.split('T')[0] : '';
            const abnormalCount = (r.results || []).filter(x => x.abnormal).length;
            const hasAbnormal = abnormalCount > 0;
            html += `<tr class="${hasAbnormal?'abnormal-row':''}">
                <td>${date}</td>
                <td>${r.category}</td>
                <td>${(r.results || []).length}</td>
                <td>${hasAbnormal ? '<span class="text-danger">'+abnormalCount+' 项异常</span>' : '<span class="text-success">全部正常</span>'}</td>
                <td>
                    <button class="btn btn-ghost" onclick="editRecord(${r.id})">编辑</button>
                    <button class="btn btn-danger" onclick="deleteRecord(${r.id})">删除</button>
                </td>
            </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = '<div class="text-danger">加载失败: ' + e.message + '</div>';
    }
}

async function editRecord(id) {
    try {
        const res = await fetch(API + '/health_records/' + id);
        const record = await res.json();
        if (!record) { showToast('记录不存在', 'error'); return; }
        openRecordModal(record);
    } catch (e) { showToast('加载失败', 'error'); }
}

async function deleteRecord(id) {
    if (!confirm('确定删除此记录？此操作不可恢复。')) return;
    try {
        const res = await fetch(API + '/health_records/' + id, { method: 'DELETE' });
        if (res.ok) { showToast('删除成功', 'success'); loadRecords(); }
        else { showToast('删除失败', 'error'); }
    } catch (e) { showToast('删除失败', 'error'); }
}

// === REMINDERS ===
async function loadReminders() {
    const container = document.getElementById('reminderGrid');
    try {
        const res = await fetch(API + '/reminders?user_id=' + currentUserId + '&active_only=true');
        const reminders = await res.json();

        if (!reminders || reminders.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="icon">🔔</div><p>暂无提醒<br><br><button class="btn btn-primary" onclick="openReminderModal()">添加提醒</button></p></div>';
            return;
        }

        container.innerHTML = reminders.map(r => `
            <div class="reminder-card">
                <div class="reminder-type">${r.type === 'medication' ? '用药提醒' : '检查提醒'}</div>
                <div class="reminder-title">${r.title}</div>
                <div class="reminder-date">下次: ${r.next_date ? r.next_date.split('T')[0] : ''} ${r.frequency ? '· ' + {daily:'每天',weekly:'每周',monthly:'每月'}[r.frequency] : ''}</div>
                <div style="margin-top:10px;">
                    <button class="btn btn-danger" onclick="deleteReminder(${r.id})">删除</button>
                </div>
            </div>`).join('');
    } catch (e) {
        container.innerHTML = '<div class="text-danger">加载失败</div>';
    }
}

async function deleteReminder(id) {
    if (!confirm('确定删除此提醒？')) return;
    try {
        const res = await fetch(API + '/reminders?id=' + id, { method: 'DELETE' });
        if (res.ok) { showToast('已删除', 'success'); loadReminders(); }
        else { showToast('删除失败', 'error'); }
    } catch (e) { showToast('删除失败', 'error'); }
}

// === RECORD MODAL ===
async function openRecordModal(record) {
    // 确保配置已加载
    if (!healthConfig || healthConfig.length === 0) {
        await loadHealthConfig();
    }

    editingRecordId = record ? record.id : null;
    document.getElementById('editRecordId').value = editingRecordId || '';
    document.getElementById('recordModalTitle').textContent = editingRecordId ? '编辑健康记录' : '添加健康记录';
    document.getElementById('recordModal').classList.add('active');

    if (record) {
        document.getElementById('modalRecordDate').value = record.record_date ? record.record_date.split('T')[0] : '';
        document.getElementById('modalCategory').value = record.category;
        editingPresetResults = record.results || [];
        renderAllIndicators(editingPresetResults);
    } else {
        editingPresetResults = [];
        document.getElementById('modalCategory').value = '综合健康检查';
        renderAllIndicators([]);
    }
}

function closeRecordModal() {
    document.getElementById('recordModal').classList.remove('active');
    editingRecordId = null;
    editingPresetResults = [];
}

function renderAllIndicators(presetResults) {
    const container = document.getElementById('allIndicatorsContainer');
    const selectedCat = document.getElementById('modalCategory').value;
    // 编辑时用保存的已有数据，新增时用传入的presetResults
    const usePreset = presetResults.length > 0 ? presetResults : (editingPresetResults.length > 0 ? editingPresetResults : []);
    // "综合健康检查" 或空值 = 显示全部类别
    const cats = (selectedCat && selectedCat !== '综合健康检查') ? healthConfig.filter(c => c.name === selectedCat) : healthConfig;
    let html = '';
    cats.forEach(cat => {
        html += '<div style="margin-bottom:8px;"><div style="font-size:0.7rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">' + cat.name + '</div>';
        cat.indicators.forEach(ind => {
            const preset = usePreset.find(r => r.indicator === ind.name);
            const value = preset ? preset.value : '';
            const refDisplay = ind.reference ? '<span style="color:var(--text-muted);font-size:0.65rem;">(' + ind.reference + ')</span>' : '';
            const safeId = 'ind_' + ind.name.replace(/\s/g, '_').replace(/[^a-zA-Z0-9_]/g, '');
            html += '<div style="display:grid;grid-template-columns:1fr 100px;gap:4px;align-items:center;margin-bottom:3px;">' +
                '<div style="font-size:0.8rem;line-height:1.2;">' + ind.name + ' ' + refDisplay + '</div>' +
                '<div style="position:relative;">' +
                '<input type="number" step="any" value="' + value + '" id="' + safeId + '"' +
                ' data-indicator="' + ind.name + '" data-unit="' + ind.unit + '" data-category="' + cat.name + '"' +
                ' style="padding:4px 40px 4px 6px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:6px;color:var(--text-primary);font-size:0.8rem;text-align:right;width:100%;">' +
                '<span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:0.65rem;color:var(--text-muted);pointer-events:none;">' + (ind.unit || '') + '</span>' +
                '</div></div>';
        });
        html += '</div>';
    });
    container.innerHTML = html;
}

async function submitRecordForm(e) {
    if (e) e.preventDefault();
    const date = document.getElementById('modalRecordDate').value;
    const category = document.getElementById('modalCategory').value;

    const results = [];
    document.querySelectorAll('#allIndicatorsContainer input').forEach(input => {
        const val = parseFloat(input.value);
        if (!isNaN(val) && input.dataset.indicator) {
            results.push({ indicator: input.dataset.indicator, value: val, unit: input.dataset.unit });
        }
    });

    if (results.length === 0) { showToast('请至少填写一个指标', 'error'); return; }

    const body = { user_id: currentUserId, record_date: date, category: category, results };

    try {
        let res;
        if (editingRecordId) {
            res = await fetch(API + '/health_records/' + editingRecordId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        } else {
            res = await fetch(API + '/health_records', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        }

        if (res.ok) {
            showToast(editingRecordId ? '已更新' : '已添加', 'success');
            closeRecordModal();
            loadDashboard();
            loadRecords();
        } else {
            const d = await res.json();
            showToast(d.error || '操作失败', 'error');
        }
    } catch (e) { showToast('网络错误', 'error'); }
}

// === REMINDER MODAL ===
function openReminderModal() {
    document.getElementById('reminderModal').classList.add('active');
    document.getElementById('reminderForm').reset();
    document.getElementById('modalReminderDate').valueAsDate = new Date();
}

function closeReminderModal() {
    document.getElementById('reminderModal').classList.remove('active');
}

async function submitReminderForm(e) {
    if (e) e.preventDefault();
    const reminder = {
        user_id: currentUserId,
        type: document.getElementById('modalReminderType').value,
        title: document.getElementById('modalReminderTitle').value,
        next_date: new Date(document.getElementById('modalReminderDate').value),
        frequency: document.getElementById('modalReminderFreq').value,
        is_active: true
    };

    try {
        const res = await fetch(API + '/reminders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reminder)
        });
        if (res.ok) {
            showToast('提醒已添加', 'success');
            closeReminderModal();
            loadReminders();
        } else { showToast('添加失败', 'error'); }
    } catch (e) { showToast('网络错误', 'error'); }
}

// === TOAST ===
function showToast(msg, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
